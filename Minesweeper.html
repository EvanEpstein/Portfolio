<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MINESWEEPER</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
<style>
 :root {
 --bg: #0a0c10;
 --panel: #111520;
 --border: #1e2d45;
 --accent: #00d4ff;
 --accent2: #ff3860;
 --warn: #ffb400;
 --safe: #00e676;
 --text: #c8d8e8;
 --dim: #3a5068;
 --cell-bg: #16202e;
 --cell-hover: #1e2d45;
 --cell-revealed: #0d1520;
 --cell-border-light: #2a3f58;
 --cell-border-dark: #060c14;
 --shadow: 0 0 30px rgba(0,212,255,0.08);
 --glow: 0 0 12px rgba(0,212,255,0.5);
 }
 
 * { box-sizing: border-box; margin: 0; padding: 0; }
 
 body {
 background: var(--bg);
 color: var(--text);
 font-family: 'Share Tech Mono', monospace;
 min-height: 100vh;
 display: flex;
 flex-direction: column;
 align-items: center;
 justify-content: center;
 padding: 20px;
 background-image:
 radial-gradient(ellipse at 20% 20%, rgba(0,212,255,0.04) 0%, transparent 60%),
 radial-gradient(ellipse at 80% 80%, rgba(255,56,96,0.04) 0%, transparent 60%);
 }
 
 .container {
 max-width: 600px;
 width: 100%;
 }
 
 h1 {
 font-family: 'Orbitron', monospace;
 font-weight: 900;
 font-size: clamp(1.6rem, 5vw, 2.4rem);
 letter-spacing: 0.3em;
 color: var(--accent);
 text-shadow: var(--glow), 0 0 40px rgba(0,212,255,0.3);
 text-align: center;
 margin-bottom: 4px;
 }
 
 .subtitle {
 text-align: center;
 color: var(--dim);
 font-size: 0.7rem;
 letter-spacing: 0.2em;
 margin-bottom: 24px;
 }
 
 /* HUD */
 .hud {
 background: var(--panel);
 border: 1px solid var(--border);
 border-radius: 6px;
 padding: 14px 20px;
 display: flex;
 align-items: center;
 justify-content: space-between;
 margin-bottom: 12px;
 box-shadow: var(--shadow);
 }
 
 .hud-stat {
 display: flex;
 flex-direction: column;
 align-items: center;
 gap: 2px;
 min-width: 70px;
 }
 
 .hud-label {
 font-size: 0.6rem;
 letter-spacing: 0.15em;
 color: var(--dim);
 }
 
 .hud-value {
 font-family: 'Orbitron', monospace;
 font-size: 1.5rem;
 font-weight: 700;
 color: var(--accent);
 text-shadow: var(--glow);
 min-width: 3ch;
 text-align: center;
 }
 
 .hud-value.danger { color: var(--accent2); text-shadow: 0 0 12px rgba(255,56,96,0.5); }
 .hud-value.warn { color: var(--warn); text-shadow: 0 0 12px rgba(255,180,0,0.5); }
 
 .reset-btn {
 background: none;
 border: 1px solid var(--border);
 border-radius: 4px;
 padding: 8px 16px;
 color: var(--text);
 font-family: 'Share Tech Mono', monospace;
 font-size: 0.75rem;
 letter-spacing: 0.1em;
 cursor: pointer;
 transition: all 0.15s;
 }
 
 .reset-btn:hover {
 border-color: var(--accent);
 color: var(--accent);
 box-shadow: 0 0 10px rgba(0,212,255,0.2);
 }
 
 /* Difficulty selector */
 .difficulty {
 display: flex;
 gap: 8px;
 margin-bottom: 12px;
 justify-content: center;
 }
 
 .diff-btn {
 background: var(--panel);
 border: 1px solid var(--border);
 border-radius: 4px;
 padding: 6px 14px;
 color: var(--dim);
 font-family: 'Share Tech Mono', monospace;
 font-size: 0.7rem;
 letter-spacing: 0.1em;
 cursor: pointer;
 transition: all 0.15s;
 }
 
 .diff-btn:hover, .diff-btn.active {
 border-color: var(--accent);
 color: var(--accent);
 background: rgba(0,212,255,0.05);
 }
 
 /* Board wrapper */
 .board-wrap {
 background: var(--panel);
 border: 1px solid var(--border);
 border-radius: 6px;
 padding: 16px;
 display: flex;
 justify-content: center;
 box-shadow: var(--shadow);
 overflow-x: auto;
 }
 
 /* Grid */
 #board {
 display: grid;
 gap: 2px;
 user-select: none;
 }
 
 /* Cell */
 .cell {
 width: 32px;
 height: 32px;
 background: var(--cell-bg);
 border: 1px solid var(--cell-border-light);
 border-radius: 3px;
 display: flex;
 align-items: center;
 justify-content: center;
 font-size: 0.8rem;
 font-weight: bold;
 cursor: pointer;
 transition: background 0.08s, transform 0.08s, box-shadow 0.08s;
 position: relative;
 box-shadow: inset 0 1px 0 rgba(255,255,255,0.05);
 }
 
 .cell:not(.revealed):not(.flagged):hover {
 background: var(--cell-hover);
 box-shadow: 0 0 8px rgba(0,212,255,0.15), inset 0 1px 0 rgba(255,255,255,0.07);
 transform: scale(1.05);
 z-index: 1;
 }
 
 .cell.revealed {
 background: var(--cell-revealed);
 border-color: var(--cell-border-dark);
 cursor: default;
 box-shadow: none;
 }
 
 .cell.flagged {
 background: rgba(255,180,0,0.08);
 border-color: rgba(255,180,0,0.3);
 cursor: pointer;
 }
 
 .cell.mine-hit {
 background: rgba(255,56,96,0.25);
 border-color: var(--accent2);
 box-shadow: 0 0 12px rgba(255,56,96,0.4);
 animation: boom 0.3s ease;
 }
 
 .cell.mine-revealed {
 background: rgba(255,56,96,0.08);
 border-color: rgba(255,56,96,0.2);
 }
 
 @keyframes boom {
 0% { transform: scale(1); }
 40% { transform: scale(1.3); }
 100% { transform: scale(1); }
 }
 
 .cell.safe-flash {
 animation: safePulse 0.3s ease;
 }
 
 @keyframes safePulse {
 0% { box-shadow: 0 0 0 rgba(0,230,118,0); }
 50% { box-shadow: 0 0 16px rgba(0,230,118,0.5); }
 100% { box-shadow: 0 0 0 rgba(0,230,118,0); }
 }
 
 /* Number colors */
 .n1 { color: #64b5f6; }
 .n2 { color: #81c784; }
 .n3 { color: var(--accent2); }
 .n4 { color: #7c4dff; }
 .n5 { color: #ff6d00; }
 .n6 { color: #00bcd4; }
 .n7 { color: #e91e63; }
 .n8 { color: #9e9e9e; }
 
 /* Overlay */
 .overlay {
 display: none;
 position: fixed;
 inset: 0;
 background: rgba(10,12,16,0.85);
 backdrop-filter: blur(4px);
 z-index: 100;
 align-items: center;
 justify-content: center;
 flex-direction: column;
 gap: 16px;
 }
 
 .overlay.show { display: flex; }
 
 .overlay-box {
 background: var(--panel);
 border: 1px solid var(--border);
 border-radius: 8px;
 padding: 36px 48px;
 text-align: center;
 box-shadow: 0 0 60px rgba(0,0,0,0.6);
 }
 
 .overlay-title {
 font-family: 'Orbitron', monospace;
 font-weight: 900;
 font-size: 2rem;
 letter-spacing: 0.2em;
 margin-bottom: 8px;
 }
 
 .overlay-title.win { color: var(--safe); text-shadow: 0 0 20px rgba(0,230,118,0.5); }
 .overlay-title.lose { color: var(--accent2); text-shadow: 0 0 20px rgba(255,56,96,0.5); }
 
 .overlay-sub {
 color: var(--dim);
 font-size: 0.75rem;
 letter-spacing: 0.15em;
 margin-bottom: 24px;
 }
 
 .overlay-btn {
 background: none;
 border: 1px solid var(--accent);
 border-radius: 4px;
 padding: 10px 28px;
 color: var(--accent);
 font-family: 'Orbitron', monospace;
 font-size: 0.8rem;
 letter-spacing: 0.15em;
 cursor: pointer;
 transition: all 0.15s;
 text-shadow: var(--glow);
 box-shadow: 0 0 12px rgba(0,212,255,0.15);
 }
 
 .overlay-btn:hover {
 background: rgba(0,212,255,0.1);
 box-shadow: 0 0 20px rgba(0,212,255,0.3);
 }
 
 .footer {
 text-align: center;
 color: var(--dim);
 font-size: 0.6rem;
 letter-spacing: 0.15em;
 margin-top: 12px;
 }
</style>
</head>
<body>
 
<div class="container">
 <h1>MINESWEEPER</h1>
 <p class="subtitle">LEFT CLICK — REVEAL &nbsp;|&nbsp; RIGHT CLICK — FLAG</p>
 
 <div class="difficulty">
 <button class="diff-btn active" data-diff="easy">EASY</button>
 <button class="diff-btn" data-diff="medium">MEDIUM</button>
 <button class="diff-btn" data-diff="hard">HARD</button>
 </div>
 
 <div class="hud">
 <div class="hud-stat">
 <span class="hud-label">MINES</span>
 <span class="hud-value danger" id="mineCount">—</span>
 </div>
 <button class="reset-btn" id="resetBtn">[ RESTART ]</button>
 <div class="hud-stat">
 <span class="hud-label">TIME</span>
 <span class="hud-value warn" id="timer">000</span>
 </div>
 </div>
 
 <div class="board-wrap">
 <div id="board"></div>
 </div>
 
 <p class="footer">BEST TIME: <span id="bestTime">—</span></p>
</div>
 
<div class="overlay" id="overlay">
 <div class="overlay-box">
 <div class="overlay-title" id="overlayTitle">—</div>
 <div class="overlay-sub" id="overlaySub">—</div>
 <button class="overlay-btn" id="overlayBtn">PLAY AGAIN</button>
 </div>
</div>
 
<script>
 const CONFIGS = {
 easy: { rows: 9, cols: 9, mines: 10 },
 medium: { rows: 16, cols: 16, mines: 40 },
 hard: { rows: 16, cols: 30, mines: 99 },
 };
 
 let cfg, board, revealed, flagged, gameOver, gameWon, firstClick;
 let timerInterval, seconds;
 let currentDiff = 'easy';
 
 const $ = id => document.getElementById(id);
 const boardEl = $('board');
 const timerEl = $('timer');
 const mineCountEl = $('mineCount');
 const overlayEl = $('overlay');
 const overlayTitle = $('overlayTitle');
 const overlaySub = $('overlaySub');
 const bestTimeEl = $('bestTime');
 
 function initGame() {
 cfg = CONFIGS[currentDiff];
 board = [];
 revealed = [];
 flagged = [];
 gameOver = false;
 gameWon = false;
 firstClick = true;
 seconds = 0;
 clearInterval(timerInterval);
 timerEl.textContent = '000';
 overlayEl.classList.remove('show');
 
 for (let r = 0; r < cfg.rows; r++) {
 board.push(new Array(cfg.cols).fill(0));
 revealed.push(new Array(cfg.cols).fill(false));
 flagged.push(new Array(cfg.cols).fill(false));
 }
 
 updateMineCount();
 renderBoard();
 updateBestTime();
 }
 
 function placeMines(safeR, safeC) {
 let placed = 0;
 while (placed < cfg.mines) {
 const r = Math.floor(Math.random() * cfg.rows);
 const c = Math.floor(Math.random() * cfg.cols);
 if (board[r][c] === -1) continue;
 if (Math.abs(r - safeR) <= 1 && Math.abs(c - safeC) <= 1) continue;
 board[r][c] = -1;
 placed++;
 }
 for (let r = 0; r < cfg.rows; r++) {
 for (let c = 0; c < cfg.cols; c++) {
 if (board[r][c] === -1) continue;
 board[r][c] = countAdjacentMines(r, c);
 }
 }
 }
 
 function countAdjacentMines(r, c) {
 let count = 0;
 eachNeighbor(r, c, (nr, nc) => { if (board[nr][nc] === -1) count++; });
 return count;
 }
 
 function eachNeighbor(r, c, fn) {
 for (let dr = -1; dr <= 1; dr++) {
 for (let dc = -1; dc <= 1; dc++) {
 if (dr === 0 && dc === 0) continue;
 const nr = r + dr, nc = c + dc;
 if (nr >= 0 && nr < cfg.rows && nc >= 0 && nc < cfg.cols) fn(nr, nc);
 }
 }
 }
 
 function renderBoard() {
 boardEl.style.gridTemplateColumns = `repeat(${cfg.cols}, 32px)`;
 boardEl.innerHTML = '';
 for (let r = 0; r < cfg.rows; r++) {
 for (let c = 0; c < cfg.cols; c++) {
 const cell = document.createElement('div');
 cell.className = 'cell';
 cell.dataset.r = r;
 cell.dataset.c = c;
 cell.addEventListener('click', handleClick);
 cell.addEventListener('contextmenu', handleRightClick);
 boardEl.appendChild(cell);
 }
 }
 }
 
 function cellEl(r, c) {
 return boardEl.querySelector(`[data-r="${r}"][data-c="${c}"]`);
 }
 
 function updateCell(r, c) {
 const el = cellEl(r, c);
 el.className = 'cell';
 el.textContent = '';
 
 if (flagged[r][c]) {
 el.classList.add('flagged');
 el.textContent = '⚑';
 el.style.color = '#ffb400';
 return;
 }
 
 if (!revealed[r][c]) return;
 
 el.classList.add('revealed');
 const val = board[r][c];
 if (val === -1) {
 el.textContent = '✸';
 el.style.color = '#ff3860';
 el.style.fontSize = '1rem';
 } else if (val > 0) {
 el.textContent = val;
 el.classList.add(`n${val}`);
 }
 }
 
 function handleClick(e) {
 if (gameOver || gameWon) return;
 const r = +e.currentTarget.dataset.r;
 const c = +e.currentTarget.dataset.c;
 if (flagged[r][c] || revealed[r][c]) return;
 
 if (firstClick) {
 firstClick = false;
 placeMines(r, c);
 startTimer();
 }
 
 if (board[r][c] === -1) {
 triggerGameOver(r, c);
 return;
 }
 
 floodReveal(r, c);
 checkWin();
 }
 
 function handleRightClick(e) {
 e.preventDefault();
 if (gameOver || gameWon) return;
 const r = +e.currentTarget.dataset.r;
 const c = +e.currentTarget.dataset.c;
 if (revealed[r][c]) return;
 flagged[r][c] = !flagged[r][c];
 updateCell(r, c);
 updateMineCount();
 }
 
 function floodReveal(r, c) {
 if (revealed[r][c] || flagged[r][c]) return;
 revealed[r][c] = true;
 updateCell(r, c);
 
 if (board[r][c] === 0) {
 eachNeighbor(r, c, (nr, nc) => floodReveal(nr, nc));
 }
 }
 
 function triggerGameOver(hitR, hitC) {
 gameOver = true;
 clearInterval(timerInterval);
 
 revealed[hitR][hitC] = true;
 const hitEl = cellEl(hitR, hitC);
 hitEl.classList.add('revealed', 'mine-hit');
 hitEl.textContent = '✸';
 hitEl.style.color = '#ff3860';
 hitEl.style.fontSize = '1rem';
 
 // Reveal all mines with stagger
 let delay = 60;
 for (let r = 0; r < cfg.rows; r++) {
 for (let c = 0; c < cfg.cols; c++) {
 if (board[r][c] === -1 && !(r === hitR && c === hitC)) {
 const mr = r, mc = c;
 setTimeout(() => {
 revealed[mr][mc] = true;
 const el = cellEl(mr, mc);
 el.classList.add('revealed', 'mine-revealed');
 el.textContent = flagged[mr][mc] ? '⚑' : '✸';
 el.style.color = flagged[mr][mc] ? '#00e676' : '#ff3860';
 el.style.fontSize = '0.9rem';
 }, delay);
 delay += 18;
 }
 }
 }
 
 setTimeout(() => {
 overlayTitle.textContent = 'GAME OVER';
 overlayTitle.className = 'overlay-title lose';
 overlaySub.textContent = `YOU SURVIVED ${seconds}s — BETTER LUCK NEXT TIME`;
 overlayEl.classList.add('show');
 }, delay + 200);
 }
 
 function checkWin() {
 let unrevealedSafe = 0;
 for (let r = 0; r < cfg.rows; r++)
 for (let c = 0; c < cfg.cols; c++)
 if (!revealed[r][c] && board[r][c] !== -1) unrevealedSafe++;
 
 if (unrevealedSafe === 0) {
 gameWon = true;
 clearInterval(timerInterval);
 saveBestTime();
 setTimeout(() => {
 overlayTitle.textContent = 'CLEARED';
 overlayTitle.className = 'overlay-title win';
 overlaySub.textContent = `FIELD SWEPT IN ${seconds}s`;
 overlayEl.classList.add('show');
 }, 200);
 }
 }
 
 function startTimer() {
 timerInterval = setInterval(() => {
 seconds++;
 timerEl.textContent = String(seconds).padStart(3, '0');
 }, 1000);
 }
 
 function updateMineCount() {
 let flagCount = 0;
 for (let r = 0; r < cfg.rows; r++)
 for (let c = 0; c < cfg.cols; c++)
 if (flagged[r][c]) flagCount++;
 const remaining = cfg.mines - flagCount;
 mineCountEl.textContent = String(remaining).padStart(3, '0');
 }
 
 function saveBestTime() {
 const key = `minesweeper_best_${currentDiff}`;
 const prev = localStorage.getItem(key);
 if (!prev || seconds < +prev) localStorage.setItem(key, seconds);
 updateBestTime();
 }
 
 function updateBestTime() {
 const key = `minesweeper_best_${currentDiff}`;
 const val = localStorage.getItem(key);
 bestTimeEl.textContent = val ? `${val}s [${currentDiff.toUpperCase()}]` : '—';
 }
 
 // Difficulty buttons
 document.querySelectorAll('.diff-btn').forEach(btn => {
 btn.addEventListener('click', () => {
 document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('active'));
 btn.classList.add('active');
 currentDiff = btn.dataset.diff;
 initGame();
 });
 });
 
 $('resetBtn').addEventListener('click', initGame);
 $('overlayBtn').addEventListener('click', initGame);
 
 initGame();
</script>
</body>
</html>
